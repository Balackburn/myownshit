  <script>
    // Lock-on HUD of S8 (host starts at f256 = 8.533 s). All positions and colours measured on the original, frame by frame:

    // (68,84)-(513,529); the diamond follows the tornado (white outline, then filled red); LOCKED scales in f293-f297 and blinks off f302-f303.
    const tl = gsap.timeline({ paused: true });
    const T = f => (f - 256) / 30;
    // box keys: [frame, x0, y0, x1, y1]
    const W = [[256, 10, 28, 564, 590], [258, 31, 46, 554, 560], [262, 20, 42, 550, 571], [270, 22, 53, 522, 553], [281, 30, 54, 536, 560],
               [283, 36, 58, 530, 548], [286, 64, 56, 518, 540], [288, 48, 74, 520, 535], [290, 42, 82, 518, 532]];
    const R = [[291, 69, 90, 513, 529], [296, 74, 86, 519, 530], [300, 69, 84, 513, 529]];
    const place = (pre, A, keys) => {
      const [f0, x0, y0, x1, y1] = keys[0];
      tl.set(`#${pre}-tl`, { x: x0, y: y0 }, 0); tl.set(`#${pre}-tr`, { x: x1 - A, y: y0 }, 0);
      tl.set(`#${pre}-bl`, { x: x0, y: y1 - A }, 0); tl.set(`#${pre}-br`, { x: x1 - A, y: y1 - A }, 0);
      for (let i = 1; i < keys.length; i++) {
        const [fa] = keys[i - 1], [fb, a0, b0, a1, b1] = keys[i], d = T(fb) - T(fa), at = T(fa);
        tl.to(`#${pre}-tl`, { x: a0, y: b0, duration: d, ease: "none" }, at); tl.to(`#${pre}-tr`, { x: a1 - A, y: b0, duration: d, ease: "none" }, at);

      }
    };
    place("w", 88, W); place("r", 74, R);
    tl.fromTo(".w", { opacity: 0 }, { opacity: 1, duration: T(258), ease: "none" }, 0);
    tl.set(".w", { borderColor: "#F7C837" }, T(282));
    tl.set(".w", { borderColor: "#F79544" }, T(290));
    tl.set(".w", { opacity: 0 }, T(291)); tl.set(".r", { opacity: 1 }, T(291));

    tl.set("#dia-w", { opacity: 0 }, T(291)); tl.set("#dia-r", { opacity: 1 }, T(291));
    // LOCKED tag
    tl.fromTo("#locked", { opacity: 0, scale: 0.55 }, { opacity: 1, scale: 1, duration: T(297) - T(293), ease: "back.out(2)" }, T(293));
    tl.set("#locked", { opacity: 0 }, T(302)); tl.set("#locked", { opacity: 1 }, T(304));
    window.__timelines["hud"] = tl;
