<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      body { font-family: "Nunito", sans-serif; }
    </style>
  </head>
  <body>
    <!-- "Vos papiers" remade in the style of the tornado replica (01-tornado-reverse): the 3D picture from the absurd-shorts engine
         (scripts-fr/vospapiers_tornado.py, 30 shots cut on the narration), the narration in the series' French voice placed back to back,
         the tornado film's music bed and effects on the visible actions, the replica's captions and its THEFT-card motion for three cards. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="45.6" data-width="1080" data-height="1920">
      <video id="layer3d" class="clip" src="assets/layer3d.mp4" muted playsinline
             data-start="0" data-duration="45.6" data-track-index="0"
             style="position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: contain; z-index: 1"></video>
      <audio id="soundtrack" class="clip" src="assets/audio.wav" data-start="0" data-duration="45.6" data-track-index="1" data-volume="1"></audio>
      <div id="host-agression" data-composition-id="card-agression" data-composition-src="compositions/card-agression.html"
           data-start="4.07" data-duration="0.933" data-track-index="3" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="host-papiers" data-composition-id="card-papiers" data-composition-src="compositions/card-papiers.html"
           data-start="9.737" data-duration="0.966" data-track-index="3" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="host-gav" data-composition-id="card-gav" data-composition-src="compositions/card-gav.html"
           data-start="25.4" data-duration="2.137" data-track-index="3" data-track-kind="graphics"
           data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
           data-start="0" data-duration="45.6" data-track-index="2" data-track-kind="captions"
           data-width="1080" data-height="1920" style="z-index: 4"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
