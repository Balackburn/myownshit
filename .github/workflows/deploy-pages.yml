name: Deploy demo to GitHub Pages

# Publishes the built demo to the gh-pages branch. On public repos GitHub
# auto-enables Pages for the gh-pages branch, so no manual Pages setup or
# admin-scoped token is required (the official actions/deploy-pages flow
# needs the Pages site pre-created, which GITHUB_TOKEN cannot do).
on:
  push:
    branches:
      - main
      # Deploys the demo from the feature branch too; remove after merge.
      - claude/react-molstruct-rdkit-16rc9b
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build library
        run: npm run build

      - name: Build demo
        run: npm run build:demo
        env:
          DEMO_BASE: /${{ github.event.repository.name }}/

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-demo
          commit_message: 'Deploy demo: ${{ github.sha }}'
